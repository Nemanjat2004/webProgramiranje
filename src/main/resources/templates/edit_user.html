<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uredi profil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Finansije</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/home}">Početna</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/logout}">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h2>Uredi profil</h2>
      <form th:action="@{/edit_user}" th:object="${korisnik}" method="post">
        <div class="mb-3">
          <label for="korisnickoIme" class="form-label">Korisničko ime</label>
          <input
            type="text"
            class="form-control"
            id="korisnickoIme"
            th:field="*{korisnickoIme}"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            th:field="*{email}"
            required
          />
        </div>
        <div class="mb-3">
          <label for="lozinka" class="form-label">Lozinka</label>
          <input
            type="password"
            class="form-control"
            id="lozinka"
            th:field="*{lozinka}"
            required
          />
        </div>
        <button type="submit" class="btn btn-success">Sačuvaj izmene</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
