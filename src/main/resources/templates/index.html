<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finansije - Početna stranica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .jumbotron {
        background-color: #e9ecef;
        padding: 2rem;
        margin-bottom: 2rem;
        border-radius: 0.3rem;
      }
      .card {
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Finansije</a>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="jumbotron text-center">
        <h1 class="display-4">Dobrodošli u Finansije!</h1>
        <p class="lead">
          Aplikacija koja vam pomaže da pratite svoje prihode i rashode,
          budžetirate i štedite.
        </p>
        <hr class="my-4" />
        <p>
          Pridružite se hiljadama zadovoljnih korisnika i preuzmite kontrolu nad
          svojim finansijama.
        </p>
      </div>

      <div class="row text-center mb-4">
        <div class="col-md-6 offset-md-3">
          <div class="card p-3 bg-light">
            <h4>Registrovanih korisnika: <span id="brojKorisnika"></span></h4>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 offset-md-3">
          <div class="card">
            <div th:if="${error}" class="alert alert-danger mt-2" role="alert">
              <span th:text="${error}"></span>
            </div>
            <div class="card-header text-center">
              <h4>Prijava korisnika</h4>
            </div>
            <div class="card-body">
              <form action="/login" method="post">
                <div class="mb-3">
                  <label for="username" class="form-label"
                    >Korisničko ime:</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Lozinka:</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                  />
                </div>
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary">
                    Prijavi se
                  </button>
                </div>
              </form>
            </div>
            <div class="card-footer text-center">
              <a href="#">Nemate nalog? Registrujte se</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // JavaScript za dohvatanje broja korisnika
      async function getBrojKorisnika() {
        try {
          const response = await fetch(
            "http://localhost:8080/api/korisnici/broj"
          );
          if (!response.ok) {
            throw new Error("Greška pri dohvatanju broja korisnika");
          }
          const brojKorisnika = await response.text();
          document.getElementById("brojKorisnika").textContent = brojKorisnika;
        } catch (error) {
          console.error("Došlo je do greške:", error);
          document.getElementById("brojKorisnika").textContent =
            "Nije dostupno";
        }
      }

      // Pozivanje funkcije pri učitavanju stranice
      window.onload = getBrojKorisnika;
    </script>
  </body>
</html>
